# Deployment only. Default local H2 and JSON Server configurations are unchanged.
server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

# No file-based database fallback: missing credentials must fail startup.
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# Avoid races and unintended reseeding when multiple function instances start.
app.seed=false
# Optional remote JSON Server catalog for the RestTemplate import endpoint.
app.catalog-url=${CATALOG_API_URL:}
